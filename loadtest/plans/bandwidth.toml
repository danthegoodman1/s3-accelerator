# Bandwidth after Phase 12: large hits at rising concurrency on nodes whose
# network outruns their drives and the clients' reach of S3: 2 m8idn.32xlarge
# nodes (200 Gb/s each) and 5 c6in.16xlarge clients (100 Gb/s each), so the
# nodes' network is what limits. Reads the full plan's dataset, so seed
# that first; the warm step leaves 128 GiB of large objects in the nodes'
# page caches, and the drive step drops them.
#
#   loadtest/loadtest run loadtest/plans/bandwidth.toml

[dataset]
prefix = "full/v1"
seed = 1

# Request rate: manifests, indexes, thumbnails.
[[dataset.sets]]
name = "small"
count = 2_000_000
size = { log_uniform = ["4KiB", "256KiB"] }

# A working set larger than the cache.
[[dataset.sets]]
name = "medium"
count = 100_000
size = { log_uniform = ["1MiB", "32MiB"] }

# Throughput: dataset shards, checkpoints.
[[dataset.sets]]
name = "large"
count = 2_048
size = "256MiB"

# Analytics: a reader takes the footer, then row groups.
[[dataset.sets]]
name = "tables"
count = 4_000
size = { log_uniform = ["64MiB", "512MiB"] }
format = "parquet"
footer = "4MiB"

[[steps]]
name = "s3-large"
target = "s3"
duration = "2m"
warmup = "20s"
connections = 64
verify = "edges"
[[steps.reads]]
set = "large"

[[steps]]
name = "warm-large"
target = "cache"
requests = 1_024
connections = 16
verify = "edges"
[[steps.reads]]
set = "large"
limit = 512
keys = "sequential"
passes = 2
window = 64

[[steps]]
name = "hits-large-c16"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 16
verify = "edges"
[[steps.reads]]
set = "large"
limit = 512

[[steps]]
name = "hits-large-c64"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 64
verify = "edges"
[[steps.reads]]
set = "large"
limit = 512

[[steps]]
name = "hits-large-c128"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 128
verify = "edges"
[[steps.reads]]
set = "large"
limit = 512

[[steps]]
name = "ranges-8m"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 128
verify = "edges"
[[steps.reads]]
set = "large"
limit = 512
range = { size = "8MiB" }

[[steps]]
name = "hits-large-drive"
target = "cache"
duration = "2m"
connections = 64
drop_page_cache = true
verify = "edges"
[[steps.reads]]
set = "large"
limit = 512
