# Request rate after Phase 12: small hits and 4 KiB range hits at rising
# concurrency, on Phase 11's hosts (4 i4i.4xlarge nodes, 4 c6in.8xlarge
# clients) with `nodes_per_host = 4` in settings.toml. Reads the full
# plan's dataset, so seed that first. Small objects average about 60 KiB,
# so their hits meet the nodes' network before their CPU; 4 KiB ranges
# show the request rate CPU allows.
#
#   loadtest/loadtest run loadtest/plans/rate.toml

[dataset]
prefix = "full/v1"
seed = 1

# Request rate: manifests, indexes, thumbnails.
[[dataset.sets]]
name = "small"
count = 2_000_000
size = { log_uniform = ["4KiB", "256KiB"] }

# A working set larger than the cache.
[[dataset.sets]]
name = "medium"
count = 100_000
size = { log_uniform = ["1MiB", "32MiB"] }

# Throughput: dataset shards, checkpoints.
[[dataset.sets]]
name = "large"
count = 2_048
size = "256MiB"

# Analytics: a reader takes the footer, then row groups.
[[dataset.sets]]
name = "tables"
count = 4_000
size = { log_uniform = ["64MiB", "512MiB"] }
format = "parquet"
footer = "4MiB"

[[steps]]
name = "warm-small"
target = "cache"
requests = 1_000_000
connections = 64
verify = "edges"
[[steps.reads]]
set = "small"
limit = 500_000
keys = "sequential"
passes = 2
window = 10_000

[[steps]]
name = "warm-large"
target = "cache"
requests = 256
connections = 8
[[steps.reads]]
set = "large"
limit = 128
keys = "sequential"
passes = 2
window = 32

[[steps]]
name = "latency-small"
target = "cache"
duration = "60s"
warmup = "10s"
connections = 1
verify = "edges"
[[steps.reads]]
set = "small"
limit = 500_000

[[steps]]
name = "hits-small-c64"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 64
verify = "edges"
[[steps.reads]]
set = "small"
limit = 500_000

[[steps]]
name = "hits-small-c256"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 256
verify = "edges"
[[steps.reads]]
set = "small"
limit = 500_000

[[steps]]
name = "hits-small-c1024"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 1024
verify = "edges"
[[steps.reads]]
set = "small"
limit = 500_000

[[steps]]
name = "ranges-4k-c64"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 64
verify = "edges"
[[steps.reads]]
set = "large"
limit = 128
range = { size = "4KiB" }

[[steps]]
name = "ranges-4k-c256"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 256
verify = "edges"
[[steps.reads]]
set = "large"
limit = 128
range = { size = "4KiB" }

[[steps]]
name = "ranges-4k-c1024"
target = "cache"
duration = "2m"
warmup = "20s"
connections = 1024
verify = "edges"
[[steps.reads]]
set = "large"
limit = 128
range = { size = "4KiB" }

