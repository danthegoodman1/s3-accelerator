# Serves the s3proxy that `scripts/s3proxy start` runs, on 127.0.0.1:9000,
# with the same credentials, so the conformance suite runs unchanged.
listen = "127.0.0.1:9000"

[origin]
endpoint = "http://127.0.0.1:8080"
region = "us-east-1"
access_key_id = "local-identity"
secret_access_key = "local-credential"

[[clients]]
access_key_id = "local-identity"
secret_access_key = "local-credential"
grants = [{ bucket = "*" }]

[cache]
data_dir = "target/local-cache"
block_size = 65536
chunk_blocks = 16
extent_size = 1048576
extents = 16
min_slot = 4096
fill_budget = 4194304
