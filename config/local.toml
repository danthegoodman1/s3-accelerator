# One process runs the gateway and a storage node against the s3proxy that
# `scripts/s3proxy start` runs. The gateway serves 127.0.0.1:9000 with
# s3proxy's credentials, so the conformance suite runs unchanged.

[origin]
endpoint = "http://localhost:8080"
region = "us-east-1"
access_key_id = "local-identity"
secret_access_key = "local-credential"

[[clients]]
access_key_id = "local-identity"
secret_access_key = "local-credential"
grants = [{ bucket = "*", access = "admin" }]

[cache]
block_size = 65536
chunk_blocks = 16
extent_size = 1048576
extents = 16
min_slot = 4096
fill_budget = 4194304

[cluster]
secret = "local-cluster-secret"
nodes = [{ id = 0, address = "127.0.0.1:9100" }]

[gateway]
listen = "127.0.0.1:9000"
# Requests to bucket.localhost name their bucket in the host.
domains = ["localhost"]

[node]
id = 0
data_dir = "target/local-cache"
