[package]
name = "s3-accelerator"
description = "The storage node and gateway binary."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
xmlparser = "0.13.6"
s3-accelerator-core.workspace = true
bytes = "1.12.1"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.0"
http-body-util = { version = "0.1.5", features = ["channel"] }
httparse = "1.10.1"
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["aws-lc-rs", "http1", "rustls-platform-verifier", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2.189"
percent-encoding = "2.3.2"
rustix = { version = "1", features = ["event", "fs", "mm", "net", "param", "pipe"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.6"
xxhash-rust.workspace = true
ktls = "6.0.2"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }

[dev-dependencies]
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
