[package]
name = "s3-accelerator-load"
description = "Load-tests a cluster, or S3 itself, from many client hosts."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
s3-accelerator = { path = "../server" }
s3-accelerator-core.workspace = true
httparse = "1.10.1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustls-platform-verifier = "0.7.1"
rustix = { version = "1", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
toml = "1.1.6"
xxhash-rust.workspace = true
