[package]
name = "s3-accelerator-conformance"
description = "S3 behavior the accelerator must preserve, tested against a live endpoint."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "harness.rs"

[[test]]
name = "get_object"
path = "get_object.rs"

[[test]]
name = "api"
path = "api.rs"

[dependencies]
aws-sdk-s3.workspace = true
aws-smithy-http-client = { version = "1.4.2", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1.18.0", features = ["client"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
