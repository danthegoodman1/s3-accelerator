name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    # Kernel TLS needs Linux 7.0 or later: 6.17's receive-buffer checks
    # stall kernel TLS links over loopback (see Kernel in spec.md).
    runs-on: ubuntu-26.04
    services:
      s3proxy:
        # Keep in step with scripts/s3proxy.
        image: andrewgaul/s3proxy:4.1.1@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04
        env:
          JCLOUDS_PROVIDER: transient
          S3PROXY_VIRTUALHOST: localhost
        ports:
          - 8080:80
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install strace, which the zero-copy tests trace the server with
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Load the kernel TLS module, which the kTLS tests check
        run: sudo modprobe tls && test -e /proc/net/tls_stat
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: scripts/s3proxy wait
      - run: cargo test --workspace -- --include-ignored
      - name: Conformance through the accelerator
        run: |
          target/debug/s3-accelerator config/local.toml &
          server=$!
          for _ in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 0.5; done
          CONFORMANCE_ENDPOINT=http://127.0.0.1:9000 cargo test -p s3-accelerator-conformance -- --ignored
          kill -TERM "$server"
          wait "$server"
      - name: Conformance through a multi-process cluster
        run: |
          scripts/cluster start 3
          CONFORMANCE_ENDPOINT=http://127.0.0.1:9000 cargo test -p s3-accelerator-conformance -- --ignored
          scripts/cluster stop
      - name: Conformance over kernel TLS through a multi-process cluster
        run: |
          scripts/cluster start 3 --tls
          before=$(awk '/^TlsTxSw/ { print $2 }' /proc/net/tls_stat)
          CONFORMANCE_ENDPOINT=https://127.0.0.1:9000 SSL_CERT_FILE=$PWD/target/cluster/tls/cert.pem \
            cargo test -p s3-accelerator-conformance -- --ignored
          after=$(awk '/^TlsTxSw/ { print $2 }' /proc/net/tls_stat)
          scripts/cluster stop
          echo "the kernel set up $((after - before)) TLS sessions"
          test "$after" -gt "$before"
      - name: Keep the cluster's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs
          path: target/cluster/*.log

  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Simulate with the commit hash as the seed
        run: cargo run --release -p s3-accelerator-sim -- ${{ github.sha }}
